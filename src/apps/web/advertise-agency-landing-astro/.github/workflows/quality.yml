name: Quality

on:
  push:
    paths:
      - 'src/apps/web/advertise-agency-landing-astro/**'
  pull_request:
    paths:
      - 'src/apps/web/advertise-agency-landing-astro/**'

defaults:
  run:
    working-directory: src/apps/web/advertise-agency-landing-astro

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: |
            src/apps/web/advertise-agency-landing-astro/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-ci-content.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm verify:boundaries
      - run: pnpm verify:content
      - run: pnpm check
      - run: pnpm test:types
      - run: pnpm verify:component-tests
      - run: pnpm test:unit
        if: github.event_name == 'pull_request'
      - run: pnpm test:components
        if: github.event_name == 'pull_request'
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm verify:coverage
      - run: pnpm build
      - run: pnpm verify:quality
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            src/apps/web/advertise-agency-landing-astro/output/playwright
          retention-days: 7
