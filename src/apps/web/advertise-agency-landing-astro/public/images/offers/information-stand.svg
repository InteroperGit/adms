<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- An original illustration of a wall stand with document pockets. -->
  <defs>
    <linearGradient id="wall" x2="1" y2="1">
      <stop stop-color="#162735"/>
      <stop offset="1" stop-color="#34576a"/>
    </linearGradient>
    <pattern id="paper" width="120" height="170"
      patternUnits="userSpaceOnUse">
      <rect width="100" height="150" rx="2" fill="#e8eef0"/>
      <path d="M16 25h65M16 40h65M16 55h50M16 85h65M16 100h65"
        stroke="#94a7b0" stroke-width="5"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- Frame and header provide a recognizable stand silhouette. -->
  <rect x="750" y="155" width="700" height="580" rx="12"
    fill="#10202b" opacity=".4"/>
  <rect x="730" y="135" width="700" height="580" rx="12"
    fill="#f2f5f6" stroke="#9cb1bd" stroke-width="12"/>
  <rect x="752" y="157" width="656" height="100" rx="4"
    fill="#dc5919"/>
  <path d="M790 192h370M790 220h250" stroke="#ffffff"
    stroke-width="12" opacity=".9"/>
  <!-- Repeated paper slots illustrate information without invented copy. -->
  <rect x="780" y="290" width="600" height="340" fill="url(#paper)"/>
  <path d="M780 440h600M780 610h600" stroke="#7c9aad"
    stroke-width="5" opacity=".55"/>
  <circle cx="750" cy="155" r="5" fill="#718d9d"/>
  <circle cx="1410" cy="695" r="5" fill="#718d9d"/>
</svg>
