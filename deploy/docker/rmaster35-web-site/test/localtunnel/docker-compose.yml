version: '3.8'

services:
  rmaster35-web-site-test-localtunnel:
    build:
      context: ../../../../../src/apps/web/advertise-agency-site
      dockerfile: Dockerfile-localtunnel-test
    container_name: rmaster35-web-site-test-localtunnel-container
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - STRAPI_SERVICE_URL=${STRAPI_SERVICE_URL}
      - NEXT_PUBLIC_STRAPI_SERVICE_URL=${NEXT_PUBLIC_STRAPI_SERVICE_URL}
      - BREADCRUMBS_SERVICE_URL=${BREADCRUMBS_SERVICE_URL}
      - NEXT_PUBLIC_BREADCRUMBS_SERVICE_URL=${NEXT_PUBLIC_BREADCRUMBS_SERVICE_URL}
      - FORM_DATA_SERVICE_URL=${FORM_DATA_SERVICE_URL}
      - NEXT_PUBLIC_FORM_DATA_SERVICE_URL=${NEXT_PUBLIC_FORM_DATA_SERVICE_URL}
      - YANDEX_COMPANY_ID=${YANDEX_COMPANY_ID}
      - PORTFOLIO_PAGE_SIZE=${PORTFOLIO_PAGE_SIZE}
    volumes:
      - ./output:/app
    networks:
      - rmaster35
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  localtunnel-watchdog:
    image: curlimages/curl:latest
    container_name: rmaster35-web-site-localtunnel-watchdog
    depends_on:
      - rmaster35-web-site-test-localtunnel
    entrypoint: >
      sh -c '
        echo "⏱️ Жду локальный сайт...";
        until curl -sf http://rmaster35-web-site-test-localtunnel:3000/ > /dev/null; do
          echo "⏳ Сайт ещё не доступен...";
          sleep 5;
        done;
        echo "✅ Сайт поднялся.";
      
        while true; do
          echo "⏱️ Проверяю https://rmaster35.loca.lt/";
          if curl -sf https://rmaster35.loca.lt/ > /dev/null; then
            echo "✅ LocalTunnel активен";
          else
            echo "❌ LocalTunnel упал. Перезапуск...";
            docker restart rmaster35-web-site-test-localtunnel-container;
            echo "⏳ Жду повторного старта сайта...";
            until curl -sf http://rmaster35-web-site-test-localtunnel:3000/ > /dev/null; do
              sleep 5;
            done;
          fi
          sleep 30;
        done
      '
    networks:
      - rmaster35
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  rmaster35:
    external: true
    driver: bridge
