version: '3.8'

services:
  strapi-db:
    image: postgres
    container_name: rmaster35-web-site-test-strapi-postgres
    environment:
      - POSTGRES_DB=${STRAPI_DATABASE_NAME}
      - POSTGRES_USER=${STRAPI_DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${STRAPI_DATABASE_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $STRAPI_DATABASE_USERNAME" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rmaster35

  strapi:
    build:
      context: ../../../../../src/apps/web/advertise-agency-site-strapi
      dockerfile: Dockerfile-dev
      args:
        NODE_ENV: ${STRAPI_NODE_ENV}
        PORT: ${STRAPI_PORT_DEV}
    container_name: rmaster35-web-site-test-strapi
    environment:
      - DATABASE_CLIENT=${STRAPI_DATABASE_CLIENT}
      - DATABASE_HOST=${STRAPI_DATABASE_HOST}
      - DATABASE_PORT=${STRAPI_DATABASE_PORT}
      - DATABASE_NAME=${STRAPI_DATABASE_NAME}
      - DATABASE_USERNAME=${STRAPI_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${STRAPI_DATABASE_PASSWORD}
      - DATABASE_SSL=${STRAPI_DATABASE_SSL}
      - DATABASE_FILENAME=${STRAPI_DATABASE_FILENAME}
      - JWT_SECRET=${STRAPI_JWT_SECRET}
      - APP_KEYS=${STRAPI_APP_KEYS}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT}
      - HOST=${STRAPI_SERVER_HOST}
      - PORT=${STRAPI_SERVER_PORT}
    ports:
      - ${STRAPI_PORT_DEV}:${STRAPI_SERVER_PORT}
    depends_on:
      - strapi-db
    networks:
      - rmaster35
    volumes:
      - ${STRAPI_PROJECT_PATH}:/app
      - strapi_node_modules:/app/node_modules
      - ${STRAPI_DATA_PATH}/public:/app/public
      - ${STRAPI_DATA_PATH}/data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${STRAPI_SERVER_PORT}/admin" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  strapi_node_modules:
    driver: local

networks:
  rmaster35:
    external: true
    driver: bridge
